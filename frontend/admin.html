<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Admin Page</h1>
    </header>
  <table id="dataTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Timestamp</th>
        <th>Charges</th>
        <th>Payment</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="form-container" class="form-container" style="display: none;">
    <div class="container-content">
      <form id="entryForm">
        <input type="hidden" id="entryId" />

        <label>Name:</label>
        <input type="text" id="name" required>
      
        <label>Age:</label>
        <input type="number" id="age" required>
      
        <label>Gender:</label>
        <select id="gender">
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        
        <label>Charges:</label>
        <select id="charges" >
          <option>300</option>
          <option>500</option>
          <option>1000</option>
        </select>
        
        <label>Payment:</label>
        <select id="payment">
          <option>card</option>
          <option>cash</option>
          <option>upi</option>
        </select>
        <button type="submit" id="button">Submit</button>
      </form>
    </div>
  </div>
<script src="admin.js"></script>
</body>
</html>
